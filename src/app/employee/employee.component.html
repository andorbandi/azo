<h2>Dolgozók</h2>

<button class="btn btn-primary" (click)="toggleModal()">Hozzáadás</button>

@if(visibleModal) {
<div class="modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Modal title</h5>
        <button type="button" class="btn-close" 
        data-bs-dismiss="modal" aria-label="Close"
        (click)="toggleModal()"></button>
      </div>
      <div class="modal-body">
       
        <form [formGroup]="employeeForm" (ngSubmit)="createEmployee()" id="employeeForm">
            <div>
                <label for="" class="form-label">Név</label>
                <input type="text" class="form-control" formControlName="name" id="name">
            </div>
            <div>
                <label for="" class="form-label">Város</label>
                <input type="text" class="form-control" formControlName="city" id="city">
            </div>
            <div>
                <label for="" class="form-label">Fizetés</label>
                <input type="text" class="form-control" formControlName="salary" id="salary">
            </div>
            <div>
                <label for="" class="form-label">Pozíció</label>
                <input type="text" class="form-control" formControlName="positionId" id="positionId">
            </div>

        </form>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
        (click)="toggleModal()">Bezárás</button>
        <button type="submit" class="btn btn-primary"
        form="employeeForm">Mentés</button>
      </div>
    </div>
  </div>
</div>
}
